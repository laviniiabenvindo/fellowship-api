spring.application.name=fellowship-api

# Credenciais vêm de variáveis de ambiente (nada de segredo no código)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fellowship}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: expõe somente o health, sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.fellowship=INFO
